<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Beating Heart · 打火机与公主裙</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05060e; }
  canvas { display:block; }
  #hint {
    position:fixed; left:50%; bottom:2.5vh; transform:translateX(-50%);
    font:400 12px/1 system-ui,sans-serif; color:rgba(255,255,255,.28);
    pointer-events:none; user-select:none; white-space:nowrap;
  }
</style>
</head>
<body>
<div id="hint">drag to orbit</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ------------------------------------------------------------------ *
 *  CONFIG — everything tweakable lives here
 * ------------------------------------------------------------------ */
const CONFIG = {
  shellCount:  4200,           // particles on the heart's surface
  fillCount:   2100,           // particles inside the volume
  sparkCount:   700,           // embers that drift off and respawn
  thickness:    5.2,           // half-depth of the 3D heart (heart curve is ~32 wide)
  swayAngle:    0.42,          // rad — idle Y sway amplitude (a full spin would
  swaySpeed:    0.35,          // rad/s   show the heart edge-on, i.e. as a blob)
  palette:    ['#ff0044', '#ff2d55', '#ff6b9d', '#ff87b8'],
};

/* ------------------------------------------------------------------ *
 *  HEART MATH
 *
 *  Classic parametric heart curve (t in [0, 2PI]):
 *      x = 16 sin^3(t)
 *      y = 13 cos(t) - 5 cos(2t) - 2 cos(3t) - cos(4t)
 *  It spans x in [-16,16] and y in [-17, ~11.7], so its visual centre
 *  sits at y ~= -2.6. We subtract that so the shape orbits around origin.
 *
 *  3D: sweep the 2D outline through a depth angle phi in [-PI/2, PI/2].
 *      z  = thickness * sin(phi)
 *      xy = outline * cos(phi)^0.42     <- fat, rounded profile (not a disc)
 *  Multiplying by an extra `radial` in [0,1] fills the solid interior
 *  (the curve is star-shaped about its centre, so scaling toward the
 *  centre always lands inside the heart).
 * ------------------------------------------------------------------ */
const CENTER_Y = -2.6;

function heartCurve(t, out) {
  const s = Math.sin(t);
  out.x = 16 * s * s * s;
  out.y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t) - CENTER_Y;
  return out;
}

const _c = { x: 0, y: 0 };
const profile = phi => Math.pow(Math.cos(phi), 0.42);   // fuller than a sphere

/** Point on/inside the 3D heart. radial=1 -> surface, <1 -> interior. */
function heartPoint(t, phi, radial, out) {
  heartCurve(t, _c);
  const prof = profile(phi) * radial;
  out[0] = _c.x * prof;
  out[1] = _c.y * prof;
  out[2] = CONFIG.thickness * Math.sin(phi) * radial;
  return out;
}

/**
 * Depth angle, rejection-sampled with probability ~ profile(phi). Sampling phi
 * uniformly would pile particles onto the front/back poles (where the outline
 * shrinks to a point) and print a bright ghost heart in the middle.
 */
function randPhi() {
  for (;;) {
    const phi = (Math.random() * 2 - 1) * Math.PI * 0.5 * 0.985;
    if (Math.random() < profile(phi)) return phi;
  }
}

/** |dP/dt| of the heart curve — the parameter races through the lobes and
 *  crawls through the top cusp and the bottom tip. */
function speed(t) {
  const dx = 48 * Math.sin(t) * Math.sin(t) * Math.cos(t);
  const dy = -13 * Math.sin(t) + 10 * Math.sin(2 * t) + 6 * Math.sin(3 * t) + 4 * Math.sin(4 * t);
  return Math.hypot(dx, dy);
}
let MAX_SPEED = 0;
for (let i = 0; i < 2000; i++) MAX_SPEED = Math.max(MAX_SPEED, speed(i / 2000 * Math.PI * 2));

/** Curve parameter, rejection-sampled ~ arc length, so particles land evenly
 *  along the outline instead of welding into seams at the cusp and the tip. */
function randT() {
  for (;;) {
    const t = Math.random() * Math.PI * 2;
    if (Math.random() * MAX_SPEED < speed(t)) return t;
  }
}

/* ------------------------------------------------------------------ *
 *  HEARTBEAT EASING  —  "lub ... dub ....... rest"
 *
 *  pulse(): sharp smoothstep attack, quadratic decay back to 0. One
 *  cycle fires a big beat at t=0 and a smaller one at t=0.34; both have
 *  decayed by ~0.93s, leaving ~0.37s of stillness before the loop.
 *  That asymmetry is what makes it read as a heart and not a sine wave.
 * ------------------------------------------------------------------ */
const CYCLE = 1.30, ATTACK = 0.07, DECAY = 0.52;
const BEAT1 = { at: 0.00, amp: 0.150 };
const BEAT2 = { at: 0.34, amp: 0.085 };

function pulse(x) {
  if (x < 0 || x > ATTACK + DECAY) return 0;
  if (x < ATTACK) { const a = x / ATTACK; return a * a * (3 - 2 * a); } // fast rise
  const d = (x - ATTACK) / DECAY;
  return (1 - d) * (1 - d);                                            // slow fall
}

/** -> { scale, intensity } for a given elapsed time in seconds. */
function heartbeat(time) {
  const p = time % CYCLE;
  const a = BEAT1.amp * pulse(p - BEAT1.at);
  const b = BEAT2.amp * pulse(p - BEAT2.at);
  return { scale: 1 + a + b, intensity: Math.min(1, (a + b) / BEAT1.amp) };
}

/* ------------------------------------------------------------------ *
 *  SCENE
 * ------------------------------------------------------------------ */
const scene    = new THREE.Scene();
const camera   = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x05060e, 1);
document.body.appendChild(renderer.domElement);

const root = new THREE.Group();      // mouse + auto rotation
const beat = new THREE.Group();      // heartbeat scale
root.add(beat);
scene.add(root);

/* ------------------------------------------------------------------ *
 *  MATERIAL — soft glowing discs, no texture needed: the fragment
 *  shader builds a radial falloff with smoothstep and a hot white core.
 * ------------------------------------------------------------------ */
const material = new THREE.ShaderMaterial({
  uniforms: {
    uTime:  { value: 0 },
    uBeat:  { value: 0 },
    uScale: { value: 600 },   // px per world-unit at 1 unit distance (set on resize)
  },
  vertexShader: /* glsl */`
    attribute float aSize;
    attribute float aAlpha;
    attribute float aSeed;
    attribute vec3  aColor;
    uniform float uTime, uBeat, uScale;
    varying vec3  vColor;
    varying float vAlpha;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float twinkle = 0.78 + 0.22 * sin(uTime * 2.3 + aSeed * 6.2831);
      vColor  = aColor;
      vAlpha  = aAlpha * twinkle * (0.85 + 0.55 * uBeat);
      gl_PointSize = aSize * (1.0 + 0.30 * uBeat) * uScale / max(-mv.z, 0.001);
      gl_Position  = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    varying vec3  vColor;
    varying float vAlpha;
    void main() {
      float r = length(gl_PointCoord - vec2(0.5));
      if (r > 0.5) discard;
      float glow = smoothstep(0.5, 0.0, r);   // soft halo
      float core = smoothstep(0.26, 0.0, r);  // bright centre
      gl_FragColor = vec4(vColor + core * 0.7, (glow * glow + core * 0.8) * vAlpha);
    }`,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
});

const PALETTE = CONFIG.palette.map(c => new THREE.Color(c));
const pickColor = () => PALETTE[(Math.random() * PALETTE.length) | 0];

function makeGeometry(n) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('aColor',   new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('aSize',    new THREE.BufferAttribute(new Float32Array(n), 1));
  g.setAttribute('aAlpha',   new THREE.BufferAttribute(new Float32Array(n), 1));
  g.setAttribute('aSeed',    new THREE.BufferAttribute(new Float32Array(n), 1));
  return g;
}

/* ---------------- heart body: shell + interior fill ---------------- */
const BODY = CONFIG.shellCount + CONFIG.fillCount;
const bodyGeo = makeGeometry(BODY);
{
  const pos = bodyGeo.attributes.position.array;
  const col = bodyGeo.attributes.aColor.array;
  const siz = bodyGeo.attributes.aSize.array;
  const alp = bodyGeo.attributes.aAlpha.array;
  const sed = bodyGeo.attributes.aSeed.array;
  const p = [0, 0, 0];

  for (let i = 0; i < BODY; i++) {
    const shell = i < CONFIG.shellCount;
    // shell sits on the surface with a little fuzz; fill uses r^0.55 so the
    // interior stays airy and the rim stays dense.
    const radial = shell ? 1 + (Math.random() - 0.5) * 0.07
                         : Math.pow(Math.random(), 0.55) * 0.97;
    heartPoint(randT(), randPhi(), radial, p);
    pos[i * 3] = p[0]; pos[i * 3 + 1] = p[1]; pos[i * 3 + 2] = p[2];

    const c = pickColor();
    const k = shell ? 0.9 + Math.random() * 0.35 : 0.7 + Math.random() * 0.35;
    col[i * 3] = c.r * k; col[i * 3 + 1] = c.g * k; col[i * 3 + 2] = c.b * k;

    // ~8% oversized + dim = cheap bloom haze on top of additive blending
    const halo = Math.random() < 0.08;
    siz[i] = halo ? 1.0 + Math.random() * 0.9 : (shell ? 0.26 + Math.random() * 0.18
                                                       : 0.19 + Math.random() * 0.13);
    alp[i] = halo ? 0.20 : (shell ? 1.0 : 0.7);
    sed[i] = Math.random();
  }
}
beat.add(new THREE.Points(bodyGeo, material));

/* ---------------- embers: drift outward, fade, respawn ------------- */
const SP = CONFIG.sparkCount;
const sparkGeo = makeGeometry(SP);
const sparkPos = sparkGeo.attributes.position.array;
const sparkAlp = sparkGeo.attributes.aAlpha.array;
const vel  = new Float32Array(SP * 3);
const life = new Float32Array(SP);
const span = new Float32Array(SP);
const _p = [0, 0, 0];

function respawn(i, stagger) {
  heartPoint(randT(), randPhi(), 1, _p);
  sparkPos[i * 3] = _p[0]; sparkPos[i * 3 + 1] = _p[1]; sparkPos[i * 3 + 2] = _p[2];

  const len = Math.hypot(_p[0], _p[1], _p[2]) || 1;
  const speed = 1.4 + Math.random() * 3.4;
  vel[i * 3]     = _p[0] / len * speed + (Math.random() - 0.5);
  vel[i * 3 + 1] = _p[1] / len * speed + (Math.random() - 0.5) + 0.6; // slight lift
  vel[i * 3 + 2] = _p[2] / len * speed + (Math.random() - 0.5);

  span[i] = 1.6 + Math.random() * 2.2;
  life[i] = stagger ? Math.random() * span[i] : span[i];
}
{
  const col = sparkGeo.attributes.aColor.array;
  const siz = sparkGeo.attributes.aSize.array;
  const sed = sparkGeo.attributes.aSeed.array;
  for (let i = 0; i < SP; i++) {
    respawn(i, true);
    const c = pickColor();
    col[i * 3] = c.r; col[i * 3 + 1] = c.g * 0.9 + 0.1; col[i * 3 + 2] = c.b;
    siz[i] = 0.16 + Math.random() * 0.20;
    sed[i] = Math.random();
  }
}
beat.add(new THREE.Points(sparkGeo, material));

/* ------------------------------------------------------------------ *
 *  CAMERA FIT — keep the whole heart on screen in any aspect ratio
 * ------------------------------------------------------------------ */
const FIT_W = 44, FIT_H = 42;   // world box to keep visible (heart + beat + embers)
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  const vFov = camera.fov * Math.PI / 180;
  const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
  camera.position.z = Math.max((FIT_H / 2) / Math.tan(vFov / 2),
                               (FIT_W / 2) / Math.tan(hFov / 2));
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  // world-unit -> pixel conversion for gl_PointSize (resolution independent)
  material.uniforms.uScale.value = (h * renderer.getPixelRatio()) / (2 * Math.tan(vFov / 2));
}
addEventListener('resize', resize);
resize();

/* ------------------------------------------------------------------ *
 *  MOUSE / TOUCH ORBIT (damped; no OrbitControls import needed)
 * ------------------------------------------------------------------ */
let dragging = false, lastX = 0, lastY = 0;
let targetX = 0, targetY = 0, curX = 0, curY = 0;

const down = (x, y) => { dragging = true; lastX = x; lastY = y; };
const move = (x, y) => {
  if (!dragging) return;
  targetY += (x - lastX) * 0.006;
  targetX = Math.max(-1.1, Math.min(1.1, targetX + (y - lastY) * 0.006));
  lastX = x; lastY = y;
};
const up = () => { dragging = false; };

addEventListener('mousedown', e => down(e.clientX, e.clientY));
addEventListener('mousemove', e => move(e.clientX, e.clientY));
addEventListener('mouseup', up);
addEventListener('touchstart', e => down(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
addEventListener('touchmove',  e => move(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
addEventListener('touchend', up);

/* ------------------------------------------------------------------ *
 *  RENDER LOOP
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);   // clamp after tab-switch stalls
  const time = clock.elapsedTime;

  // --- heartbeat ---
  const hb = heartbeat(time);
  beat.scale.setScalar(hb.scale);
  material.uniforms.uTime.value = time;
  material.uniforms.uBeat.value = hb.intensity;

  // --- rotation: damped drag offset + idle sway around the front view ---
  curX += (targetX - curX) * 0.09;
  curY += (targetY - curY) * 0.09;
  root.rotation.set(curX, curY + CONFIG.swayAngle * Math.sin(time * CONFIG.swaySpeed), 0);

  // --- embers ---
  for (let i = 0; i < SP; i++) {
    life[i] -= dt;
    if (life[i] <= 0) { respawn(i, false); continue; }
    const j = i * 3;
    vel[j + 1] += 1.1 * dt;                       // rise
    const drag = 1 - 0.55 * dt;
    vel[j] *= drag; vel[j + 1] *= drag; vel[j + 2] *= drag;
    sparkPos[j]     += vel[j] * dt;
    sparkPos[j + 1] += vel[j + 1] * dt;
    sparkPos[j + 2] += vel[j + 2] * dt;
    const k = life[i] / span[i];
    sparkAlp[i] = Math.min(1, (1 - k) * 6) * k * k;  // quick fade-in, long fade-out
  }
  sparkGeo.attributes.position.needsUpdate = true;
  sparkGeo.attributes.aAlpha.needsUpdate = true;

  renderer.render(scene, camera);
}
animate();

console.log('heart ready:', BODY + SP, 'particles');
</script>
</body>
</html>
